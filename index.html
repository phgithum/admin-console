<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="zdWcGgUIqclgcH6mdBzL7x">
<head data-page-node-id="AgTaN3b0mX2AtBOaoTeMD0">
<meta charset="UTF-8" data-page-node-id="YBBpdfS1mVI1Oc7BZCawGj">
<meta name="viewport" content="width=device-width,initial-scale=1" data-page-node-id="qK60s4ZXRpMaG2KBIk7tgd">
<title>聚合后台 · Admin Console</title>
<style>
:root{--main:#2f6fed;--bg:#f5f7fa;--line:#e5e8ef;--txt:#222;--sub:#667}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
body{background:var(--bg);min-height:100vh;color:var(--txt)}
/* ===== 登录层 ===== */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:36px 32px;width:340px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.login-card h1{font-size:18px;margin-bottom:4px;text-align:center}
.login-card p{font-size:12px;color:var(--sub);text-align:center;margin-bottom:20px}
.login-card input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:12px;outline:none}
.login-card input:focus{border-color:var(--main)}
.login-card button{width:100%;padding:10px;border:none;border-radius:8px;background:var(--main);color:#fff;font-size:14px;cursor:pointer}
.login-card button:hover{opacity:.92}
#loginErr{color:#d33;font-size:12px;text-align:center;min-height:16px;margin-bottom:8px}
/* ===== 主界面 ===== */
#app{display:none;flex-direction:column;height:100vh}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:10px}
.topbar b{font-size:15px}
.tab{padding:6px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px}
.tab.on{background:var(--main);color:#fff;border-color:var(--main)}
.topbar .sp{flex:1}
.topbar .out{color:#d33;background:none;border:none;cursor:pointer;font-size:13px}
.frame-wrap{flex:1;position:relative}
.frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:#fff}
.empty-tip{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--sub)}
.empty-tip a{color:var(--main);text-decoration:none;font-size:14px}
.cards{display:flex;gap:24px;align-items:center;justify-content:center;flex:1;flex-wrap:wrap;padding:40px}
.card2{background:#fff;border:1px solid var(--line);border-radius:14px;padding:36px 44px;text-align:center;text-decoration:none;color:var(--txt);box-shadow:0 4px 16px rgba(0,0,0,.05);transition:.15s}
.card2:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(47,111,237,.15);border-color:var(--main)}
.card2 .ic{font-size:42px;margin-bottom:12px}
.card2 b{display:block;font-size:17px;margin-bottom:6px}
.card2 span{font-size:12px;color:var(--sub)}
</style>
</head>
<body data-page-node-id="zGORcmBa61QWUm1Wb8rhI7">

<!-- 登录 -->
<div id="login" data-page-node-id="ehIMpyjuJuM4YCsybQ9A9c">
  <div class="login-card" data-page-node-id="fXGFbls0AQEGFLCRlnwfEc">
    <h1 data-page-node-id="F3YOXQT9dhwpGGOQFGvW8w">🔐 聚合后台</h1>
    <p data-page-node-id="xXr03upblAsRvWD7z8PBBf">请输入账户密码登录</p>
    <div id="loginErr" data-page-node-id="0ZEVnwm7J8UtJoi8O8Ht2n"></div>
    <input id="u" placeholder="账户" autocomplete="username" data-page-node-id="5jVi8YkAavHux2wX0M0MkS">
    <input id="p" type="password" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" data-page-node-id="WE7HqZMLZBY2mnZpOypyhc">
    <button onclick="doLogin()" data-page-node-id="sKUk9eqTWoRedODFqgUD33">登 录</button>
  </div>
</div>

<!-- 主界面 -->
<div id="app" data-page-node-id="eMIalHRbkX3OLjk7TLNIx5">
  <div class="topbar" data-page-node-id="UppwkjTttX48yQvJA93LuS">
    <b data-page-node-id="hFOHY1EHHMzxwlPdcbV7H4">聚合后台</b>
    <button class="tab on" data-k="kb" onclick="openTarget('kb')" data-page-node-id="9fsnwm0EmjSlnQt3Qcc7qj">📚 知识库后台</button>
    <button class="tab" data-k="muji" onclick="openTarget('muji')" data-page-node-id="vbwRrdUc8erHGf0oGrfH9U">👕 MUJI 后台</button>
    <span class="sp" data-page-node-id="1DNaB7ghyzMGrgg7KMXJBG"></span>
    <button class="out" onclick="logout()" data-page-node-id="i5MqOhTnIhDuV375irdIv1">退出登录</button>
  </div>
  <div class="frame-wrap" id="frames" data-page-node-id="lKTUhlwM0OFOd7qPvDrRV5">
    <div class="cards">
      <a class="card2" id="c-kb" href="#" target="_blank" rel="noopener">
        <div class="ic">📚</div><b>知识库后台</b><span>360 检索台配置 / 发布 / 统计</span>
      </a>
      <a class="card2" id="c-muji" href="#" target="_blank" rel="noopener">
        <div class="ic">👕</div><b>MUJI 后台</b><span>MUJI 知识库配置 / 发布</span>
      </a>
    </div>
  </div>
</div>

<script>
/* =====================================================
 *  账户密码在这里改（改完 GitHub 上保存即可生效）
 * ===================================================== */
var ADMIN_USER = "panhao";
var ADMIN_PASS = "panhao123";

/* 各后台地址（GitHub Pages 稳定入口） */
var TARGETS = {
  kb:   "https://phgithum.github.io/360-kb/admin.html",
  muji: "https://phgithum.github.io/MUJI/admin.html"
};

var SS_KEY = "console_auth";

function $(id){return document.getElementById(id)}

function doLogin(){
  var u=$("u").value.trim(), p=$("p").value;
  if(u===ADMIN_USER && p===ADMIN_PASS){
    try{sessionStorage.setItem(SS_KEY,"1")}catch(e){}
    $("login").style.display="none";
    $("app").style.display="flex";
    bindCards();
  }else{
    $("loginErr").textContent="账户或密码错误";
  }
}

function bindCards(){
  $("c-kb").href = TARGETS.kb;
  $("c-muji").href = TARGETS.muji;
}

function logout(){
  try{sessionStorage.removeItem(SS_KEY)}catch(e){}
  location.reload();
}

function openTarget(k){
  window.open(TARGETS[k], "_blank", "noopener");
}

/* 已登录则直接进 */
try{
  if(sessionStorage.getItem(SS_KEY)==="1"){
    $("login").style.display="none";
    $("app").style.display="flex";
    bindCards();
  }
}catch(e){}
</script>
</body>
</html>
