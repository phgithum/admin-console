<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="NV1sj4N1NxNMkiQrbKB2KN">
<head data-page-node-id="7soNp7NYlf8amjx8IdIDMJ">
<meta charset="UTF-8" data-page-node-id="w3puOWcaeUTRKU7AmFUNSQ">
<meta name="viewport" content="width=device-width,initial-scale=1" data-page-node-id="eSKhZkarf1jLS72pUnoFoO">
<title>聚合后台 · Admin Console</title>
<style>
:root{--main:#2f6fed;--bg:#f5f7fa;--line:#e5e8ef;--txt:#222;--sub:#667}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
body{background:var(--bg);min-height:100vh;color:var(--txt)}
/* ===== 登录层 ===== */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:36px 32px;width:340px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.login-card h1{font-size:18px;margin-bottom:4px;text-align:center}
.login-card p{font-size:12px;color:var(--sub);text-align:center;margin-bottom:20px}
.login-card input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:12px;outline:none}
.login-card input:focus{border-color:var(--main)}
.login-card button{width:100%;padding:10px;border:none;border-radius:8px;background:var(--main);color:#fff;font-size:14px;cursor:pointer}
#loginErr{color:#d33;font-size:12px;text-align:center;min-height:16px;margin-bottom:8px}
/* ===== 主界面 ===== */
#app{display:none;flex-direction:column;height:100vh}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:8px}
.topbar b{font-size:14px;margin-right:6px}
.tab{padding:6px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px}
.tab.on{background:var(--main);color:#fff;border-color:var(--main)}
.topbar .sp{flex:1}
.topbar .out{color:#d33;background:none;border:none;cursor:pointer;font-size:13px}
.frame-wrap{flex:1;position:relative;background:#fff}
.frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:#fff}
.load-tip{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--sub);background:#fff;z-index:5}
.load-tip a{color:var(--main)}
</style>
</head>
<body data-page-node-id="ACfrQS34sUJtRis1MgeT4i">

<div id="login" data-page-node-id="v9aQmd3uPPe5KumqHHn37U">
  <div class="login-card" data-page-node-id="8Wl3UQmzRVHJm4xdSLeGJt">
    <h1 data-page-node-id="sBSfHCQHL3oExYHkmXzLXR">🔐 聚合后台</h1>
    <p data-page-node-id="y1Nzfq7G5oLGMFMvRt0PTA">请输入账户密码登录</p>
    <div id="loginErr" data-page-node-id="KcFHmNXwQRHpsF0bJxxqKS"></div>
    <input id="u" placeholder="账户" autocomplete="username" data-page-node-id="IAEhGekkl0gMGhQljmhl2r">
    <input id="p" type="password" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" data-page-node-id="hTNJ1X6y86HdiznlKJSrl5">
    <button onclick="doLogin()" data-page-node-id="LM3ZHLww9PrrGacJzPw1rW">登 录</button>
  </div>
</div>

<div id="app" data-page-node-id="3wY9qZqAnhA0kGYCZJ9oue">
  <div class="topbar" data-page-node-id="ZqwbGso2BEi842oSwbxBvS">
    <b data-page-node-id="Gzcy1DAsikDVxMZbAewHkA">聚合后台</b>
    <button class="tab on" data-k="kb" onclick="switchTab('kb',this)" data-page-node-id="yGZC4A59VEDdWLdGAn4nSH">📚 知识库后台</button>
    <button class="tab" data-k="muji" onclick="switchTab('muji',this)" data-page-node-id="0lBcpn4uJzmwuHOEMH4EQk">👕 MUJI 后台</button>
    <span class="sp" data-page-node-id="NDYrwMQ23IQzDFKoDITqFd"></span>
    <button class="out" onclick="logout()" data-page-node-id="Ervlp4GrXCDZQmkw3rj86W">退出登录</button>
  </div>
  <div class="frame-wrap" data-page-node-id="DiXMIQZuUqCBjtNtFBcZj0">
    <iframe id="f-kb" src="" hidden data-page-node-id="0KNhDsPc9fPDnTsBDhvO18"></iframe>
    <iframe id="f-muji" src="" hidden data-page-node-id="6TD0GkTDEo8sWv7VgpTCPi"></iframe>
    <div class="load-tip" id="tip" data-page-node-id="xXb4P3WiJeCOUCNYBBYN5D">
      <div data-page-node-id="zf8aSP57u7MLfQc2wq11wY">页面加载中或被浏览器拦截…</div>
      <div data-page-node-id="mLllTp2vwNKB3paJkvdiwe">如果长时间空白，<a id="tipLink" href="#" target="_blank" data-page-node-id="WTmN7vQQ3ClNlWS6CsnGVI">点这里新标签打开</a></div>
    </div>
  </div>
</div>

<script>
var ADMIN_USER = "panhao";
var ADMIN_PASS = "panhao123";
var SS_KEY = "console_auth";
var TARGETS = {
  kb:   "https://phgithum.github.io/360-kb/admin.html",
  muji: "https://phgithum.github.io/MUJI/admin.html"
};
function $(id){return document.getElementById(id)}

function doLogin(){
  if($("u").value.trim()===ADMIN_USER && $("p").value===ADMIN_PASS){
    try{sessionStorage.setItem(SS_KEY,"1")}catch(e){}
    enter();
  }else{ $("loginErr").textContent="账户或密码错误"; }
}
function logout(){ try{sessionStorage.removeItem(SS_KEY)}catch(e){} location.reload(); }
function enter(){
  $("login").style.display="none";
  $("app").style.display="flex";
  switchTab("kb", document.querySelector('.tab[data-k="kb"]'));
}

var loaded={};
function switchTab(k, btn){
  document.querySelectorAll(".tab").forEach(function(b){b.classList.remove("on")});
  btn.classList.add("on");
  ["kb","muji"].forEach(function(x){
    var f=$("f-"+x);
    if(x===k){
      f.hidden=false;
      if(!f.src){ f.src=TARGETS[x]; watch(f,x); }
      $("tip").style.display = loaded[x] ? "none" : "flex";
      $("tipLink").href = TARGETS[x];
    }else{
      f.hidden=true;
    }
  });
}
/* 8 秒没触发 load 就显示兜底提示 */
function watch(f,k){
  var done=false;
  f.addEventListener("load",function(){ done=true; loaded[k]=true;
    if(!f.hidden) $("tip").style.display="none"; });
  setTimeout(function(){
    if(!done && !f.hidden){ $("tip").style.display="flex"; $("tipLink").href=TARGETS[k]; }
  },8000);
}

try{ if(sessionStorage.getItem(SS_KEY)==="1") enter(); }catch(e){}
</script>
</body>
</html>
