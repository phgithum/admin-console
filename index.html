<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>聚合后台</title>
<style>
:root{--main:#2f6fed;--bg:#f5f7fa;--line:#e5e8ef;--sub:#667}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif}
body{background:var(--bg);color:#222}
/* 登录 */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh}
.lc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:36px 32px;width:330px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.lc h1{font-size:18px;text-align:center;margin-bottom:4px}
.lc p{font-size:12px;color:var(--sub);text-align:center;margin-bottom:20px}
.lc input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:12px;outline:none}
.lc button{width:100%;padding:10px;border:none;border-radius:8px;background:var(--main);color:#fff;font-size:14px;cursor:pointer}
#err{color:#d33;font-size:12px;text-align:center;min-height:16px;margin-bottom:8px}
/* 主界面 */
#app{display:none;flex-direction:column;height:100vh}
.bar{background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:8px}
.bar b{font-size:14px;margin-right:6px}
.tab{padding:6px 18px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px}
.tab.on{background:var(--main);color:#fff;border-color:var(--main)}
.bar .sp{flex:1}
.bar .out{color:#d33;background:none;border:none;cursor:pointer;font-size:13px}
.stage{flex:1;position:relative;background:#fff}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px;background:#fff}
</style>
</head>
<body>

<div id="login">
  <div class="lc">
    <h1>🔐 聚合后台</h1>
    <p>账户密码登录，一次进全部后台</p>
    <div id="err"></div>
    <input id="u" placeholder="账户" autocomplete="username">
    <input id="p" type="password" placeholder="密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">登 录</button>
  </div>
</div>

<div id="app">
  <div class="bar">
    <b>聚合后台</b>
    <button class="tab on" data-k="kb" onclick="show('kb')">📚 知识库后台</button>
    <button class="tab" data-k="muji" onclick="show('muji')">👕 MUJI 后台</button>
    <span class="sp"></span>
    <button class="out" onclick="logout()">退出登录</button>
  </div>
  <div class="stage">
    <iframe id="f-kb" hidden></iframe>
    <iframe id="f-muji" hidden></iframe>
    <div class="msg" id="msg">正在加载…</div>
  </div>
</div>

<script>
var ADMIN_USER="panhao", ADMIN_PASS="panhao123";
var SS="console_auth";
var PAGES={ kb:"/360-kb/admin.html", muji:"/MUJI/admin.html" };
var ready={};
function $(i){return document.getElementById(i)}

function doLogin(){
  if($("u").value.trim()===ADMIN_USER && $("p").value===ADMIN_PASS){
    try{sessionStorage.setItem(SS,"1");sessionStorage.setItem("admin_auth","1")}catch(e){}
    enter();
  }else $("err").textContent="账户或密码错误";
}
function logout(){ try{sessionStorage.clear()}catch(e){} location.reload(); }
function enter(){ $("login").style.display="none"; $("app").style.display="flex"; show("kb"); }

/* 核心改动：fetch 抓后台源码，灌进 iframe.srcdoc，不依赖 iframe 自行加载 */
var cache={};
function show(k){
  document.querySelectorAll(".tab").forEach(function(b){b.classList.remove("on")});
  document.querySelector('.tab[data-k="'+k+'"]').classList.add("on");
  ["kb","muji"].forEach(function(x){ $("f-"+x).hidden = (x!==k); });
  var f=$("f-"+k);
  if(ready[k]) { $("msg").style.display="none"; return; }
  $("msg").style.display="flex"; $("msg").textContent="正在加载"+(k==="kb"?"知识库":"MUJI")+"后台…";
  if(cache[k]){ paint(f,cache[k],k); return; }
  fetch(PAGES[k], {credentials:"same-origin"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
    .then(function(html){
      cache[k]=html;
      paint(f,html,k);
    })
    .catch(function(e){
      $("msg").textContent="加载失败："+e.message+"（刷新重试）";
    });
}
function paint(f,html,k){
  f.srcdoc=html;
  f.addEventListener("load",function once(){
    f.removeEventListener("load",once);
    ready[k]=true;
    if(!$("f-"+k).hidden) $("msg").style.display="none";
  });
}

try{ if(sessionStorage.getItem(SS)==="1") enter(); }catch(e){}
</script>
</body>
</html>
